[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nemofold"
version = "0.2.0"
description = "Private, evidence-first document agent with reversible actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Office/Business",
  "Topic :: Utilities",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=1.27,<2",
  "pypdf>=6,<7",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/NemoFold"
Documentation = "https://github.com/ellmos-ai/NemoFold#readme"
Repository = "https://github.com/ellmos-ai/NemoFold"
Issues = "https://github.com/ellmos-ai/NemoFold/issues"
Changelog = "https://github.com/ellmos-ai/NemoFold/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/NemoFold/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/NemoFold/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/NemoFold/blob/main/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/ellmos-ai/NemoFold/blob/main/llms.txt"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "openpyxl>=3.1.0",
  "pytest>=8.0",
  "ruff>=0.6",
]
# Filling somebody's own .docx template is a separate job with its own
# accumulated knowledge, so it is a separate, optional dependency rather than
# something reimplemented here. Pinned to a commit: the repository carries no
# release tag, and pinning to one that does not exist would break every install.
templates = [
  "report-forge @ git+https://github.com/ellmos-ai/report-forge.git@d581596084037b0b3a4768cda1e9c938a8687eaa",
]

[project.scripts]
nemofold = "nemofold.cli:main"
nemofold-mcp = "nemofold.mcp_server:main"

[tool.hatch.metadata]
# The templates extra points at a git commit, which the backend refuses to write
# into metadata unless this says so. The consequence is worth stating plainly:
# a distribution carrying a direct reference cannot be uploaded to PyPI, so this
# repository stays installable from source and from git, not from the index.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nemofold"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.mypy.overrides]]
# The template engine is an optional extra. A checkout without it must still
# type-check, or the optional dependency would be mandatory in practice.
module = "report_forge.*"
ignore_missing_imports = true
