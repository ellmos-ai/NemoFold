[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nemofold"
version = "0.1.0"
description = "Private, evidence-first document agent with reversible actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger" }]
dependencies = [
  "mcp>=1.27,<2",
  "pypdf>=6,<7",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/NemoFold"
Repository = "https://github.com/ellmos-ai/NemoFold"
Issues = "https://github.com/ellmos-ai/NemoFold/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]
# Filling somebody's own .docx template is a separate job with its own
# accumulated knowledge, so it is a separate, optional dependency rather than
# something reimplemented here. Pinned to a commit: the repository carries no
# release tag, and pinning to one that does not exist would break every install.
templates = [
  "report-forge @ git+https://github.com/ellmos-ai/report-forge.git@d581596084037b0b3a4768cda1e9c938a8687eaa",
]

[project.scripts]
nemofold = "nemofold.cli:main"
nemofold-mcp = "nemofold.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nemofold"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.mypy.overrides]]
# The template engine is an optional extra. A checkout without it must still
# type-check, or the optional dependency would be mandatory in practice.
module = "report_forge.*"
ignore_missing_imports = true
