[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nemofold"
version = "0.1.0"
description = "Private, evidence-first document agent with reversible actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger" }]
dependencies = [
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
nemofold = "nemofold.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nemofold"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
