name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check browser JavaScript syntax
        run: node --check src/nemofold/web/app.js
      - name: Build distributions
        run: python -m build
      - name: Smoke-test built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheel = glob.glob('dist/*.whl')[0];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', '--no-deps', wheel])"
      - name: Check installed CLI
        run: nemofold --help
