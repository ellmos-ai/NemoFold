<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="NemoFold - Bounded Reasoning">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradC_banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021218"/>
      <stop offset="50%" stop-color="#072F3A"/>
      <stop offset="100%" stop-color="#031A22"/>
    </linearGradient>
    <linearGradient id="localCardGradC_banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4A59" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06323E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cloudCardGradC_banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowC_banner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glowCyanC_banner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .eb-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #5AD2D0; letter-spacing: 2px; text-transform: uppercase; }
      .prod-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 46px; font-weight: 800; fill: #F7F1E7; letter-spacing: -0.5px; }
      .prod-sub-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 46px; font-weight: 800; fill: #5AD2D0; }
      .hl-text-c { font-family: Georgia, 'Times New Roman', serif; font-size: 58px; font-weight: 700; fill: #F7F1E7; letter-spacing: -0.5px; line-height: 1.15; }
      .sup-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 23px; font-weight: 400; fill: #C8E3E1; letter-spacing: 0.2px; }
      .chip-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #FBBF24; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- 1. Dark Architecture Canvas -->
  <rect width="1600" height="900" fill="url(#bgGradC_banner)"/>
  
  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="225" x2="1600" y2="225" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="0" y1="450" x2="1600" y2="450" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="0" y1="675" x2="1600" y2="675" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="900" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="900" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="900" stroke="#5AD2D0" stroke-width="1"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1600" height="4" fill="#5AD2D0"/>

  <!-- 2. Left Column: Text & Brand -->
  <!-- Eyebrow Pill -->
  <g transform="translate(90, 90)">
    <rect x="0" y="0" width="440" height="32" rx="16" fill="#073B49" stroke="#5AD2D0" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4.5" fill="#5AD2D0"/>
    <text x="32" y="21" class="eb-text-c">LOCAL AUTHORITY · BOUNDED REASONING</text>
  </g>

  <!-- Product Brand Mark & Name -->
  <g transform="translate(90, 205)">
    <g transform="scale(0.95)">
      <path d="M0,0 L24,-14 L42,6 L18,20 Z" fill="#FF6B4A"/>
      <path d="M18,20 L42,6 L36,36 L12,48 Z" fill="#5AD2D0"/>
      <path d="M0,0 L18,20 L12,48 L-6,26 Z" fill="#1F9D72"/>
    </g>
    <text x="58" y="32" class="prod-text-c">Nemo<tspan class="prod-sub-c">Fold</tspan></text>
  </g>

  <!-- Headline -->
  <text x="90" y="295" class="hl-text-c">Reasoning may travel.</text>
  <text x="90" y="370" class="hl-text-c">File authority stays local.</text>

  <!-- Supporting Copy -->
  <text x="90" y="450" class="sup-text-c">Explicit scope. Pseudonymized context. Local verification.</text>

  <!-- Status Chip: Cloud proof: pending -->
  <g transform="translate(90, 530)">
    <rect x="0" y="0" width="260" height="46" rx="23" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8"/>
    <!-- Pending Amber Dot -->
    <circle cx="24" cy="23" r="6.0" fill="#F59E0B"/>
    <text x="42" y="29" class="chip-text-c">Cloud proof: pending</text>
  </g>

  <!-- Key Architecture Invariants -->
  <g transform="translate(90, 600)">
    <g transform="translate(0, 0)">
      <rect width="24" height="24" rx="6" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M7,12 L11,16 L17,8" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="17" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="600" fill="#F7F1E7">Approved Folders: originals &amp; paths never leave disk</text>
    </g>
    <g transform="translate(0, 40)">
      <rect width="24" height="24" rx="6" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M7,12 L11,16 L17,8" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="17" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="600" fill="#F7F1E7">Policy &amp; Privacy Gate: fail-closed bounded budget</text>
    </g>
    <g transform="translate(0, 80)">
      <rect width="24" height="24" rx="6" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M7,12 L11,16 L17,8" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="17" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="600" fill="#F7F1E7">Evidence Verifier: local schema &amp; quote validation</text>
    </g>
  </g>

  <!-- 3. Right Graphic: Trust Split Boundary Diagram -->
  <g transform="translate(880, 110)" filter="url(#shadowC_banner)">
    
    <!-- Outer Master Graphic Container -->
    <rect width="640" height="680" rx="18" fill="#031A22" stroke="#073B49" stroke-width="2"/>

    <!-- ZONE A: LOCAL AUTHORITY (Left ~56% of graphic) -->
    <rect x="18" y="18" width="358" height="644" rx="14" fill="url(#localCardGradC_banner)" stroke="#1F9D72" stroke-width="1.8"/>
    
    <!-- Zone Header -->
    <g transform="translate(30, 44)">
      <circle cx="8" cy="8" r="6.0" fill="#1F9D72"/>
      <text x="22" y="12" font-family="'Segoe UI', sans-serif" font-size="13.5px" font-weight="800" fill="#F7F1E7" letter-spacing="1.2px">LOCAL AUTHORITY (DOMINANT)</text>
    </g>

    <!-- Node 1: Approved Files & Memory -->
    <g transform="translate(28, 78)">
      <rect width="334" height="105" rx="10" fill="#04232C" stroke="#0E5C6E" stroke-width="1.2"/>
      <text x="14" y="30" font-family="'Segoe UI', sans-serif" font-size="15px" font-weight="700" fill="#5AD2D0">Approved Files &amp; Memory</text>
      <text x="14" y="55" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#C8E3E1">· Original documents never leave disk</text>
      <text x="14" y="80" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#C8E3E1">· Local index, hashes &amp; action ledgers</text>
    </g>

    <!-- Node 2: Policy & Privacy Gate -->
    <g transform="translate(28, 197)">
      <rect width="334" height="105" rx="10" fill="#04232C" stroke="#FF6B4A" stroke-width="1.4"/>
      <text x="14" y="30" font-family="'Segoe UI', sans-serif" font-size="15px" font-weight="700" fill="#FF6B4A">Policy + Privacy Gate</text>
      <text x="14" y="55" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#C8E3E1">· Explicit scope &amp; pseudonymization</text>
      <text x="14" y="80" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#C8E3E1">· Fail closed: unapproved stays local</text>
    </g>

    <!-- Node 3: Local Evidence Verifier -->
    <g transform="translate(28, 316)">
      <rect width="334" height="105" rx="10" fill="#04232C" stroke="#1F9D72" stroke-width="1.4"/>
      <text x="14" y="30" font-family="'Segoe UI', sans-serif" font-size="15px" font-weight="700" fill="#1F9D72">Evidence Verifier</text>
      <text x="14" y="55" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#C8E3E1">· Checks quotes against local text</text>
      <text x="14" y="80" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#C8E3E1">· Verifies source IDs &amp; schema before commit</text>
    </g>

    <!-- Local Summary Guarantee Bar -->
    <g transform="translate(28, 626)">
      <rect width="334" height="38" rx="8" fill="#073B49" stroke="#1F9D72" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="167" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5px" font-weight="700" fill="#5AD2D0">NO ORIGINAL FILES OR HOST PATHS</text>
    </g>

    <!-- TRUST BOUNDARY DIVIDER -->
    <g transform="translate(387, 24)">
      <line x1="0" y1="0" x2="0" y2="632" stroke="#5AD2D0" stroke-width="2" stroke-dasharray="6 4" filter="url(#glowCyanC_banner)"/>
    </g>

    <!-- ZONE B: BOUNDED REASONING (Right ~34% of graphic) -->
    <g transform="translate(403, 18)">
      <rect width="217" height="644" rx="14" fill="url(#cloudCardGradC_banner)" stroke="#818CF8" stroke-width="1.5"/>
      
      <!-- Zone Header -->
      <g transform="translate(14, 44)">
        <circle cx="7" cy="7" r="5.5" fill="#818CF8"/>
        <text x="18" y="11" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="800" fill="#C7D2FE" letter-spacing="0.8px">BOUNDED ZONE</text>
      </g>

      <!-- Cloud Reasoning Box (4 Proven Items) -->
      <g transform="translate(14, 78)">
        <rect width="189" height="272" rx="10" fill="#0A0F1D" stroke="#6366F1" stroke-width="1.4"/>
        <text x="12" y="30" font-family="'Segoe UI', sans-serif" font-size="14.5px" font-weight="700" fill="#A5B4FC">NVIDIA Nemotron</text>
        <text x="12" y="53" font-family="'Segoe UI', sans-serif" font-size="13.5px" font-weight="600" fill="#818CF8">on Nebius</text>
        
        <line x1="12" y1="66" x2="177" y2="66" stroke="#334155" stroke-width="1"/>

        <text x="12" y="98" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#94A3B8">· Optional reasoning</text>
        <text x="12" y="125" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#94A3B8">· Selected context</text>
        <text x="12" y="153" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#94A3B8">· Pseudonymized</text>
        <text x="12" y="180" font-family="'Segoe UI', sans-serif" font-size="13px" fill="#94A3B8">· Bounded budget</text>
      </g>

      <!-- Return Path Box -->
      <g transform="translate(14, 584)">
        <rect width="189" height="64" rx="8" fill="#0A0F1D" stroke="#1F9D72" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="94" y="27" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="700" fill="#1F9D72">RETURN PATH ONLY</text>
        <text x="94" y="46" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5px" font-weight="700" fill="#5AD2D0">TO LOCAL VERIFIER</text>
      </g>
    </g>

  </g>
</svg>