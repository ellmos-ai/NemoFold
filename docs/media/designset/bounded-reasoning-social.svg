<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NemoFold - Bounded Reasoning">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradC_social" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021218"/>
      <stop offset="50%" stop-color="#072F3A"/>
      <stop offset="100%" stop-color="#031A22"/>
    </linearGradient>
    <linearGradient id="localCardGradC_social" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4A59" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06323E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cloudCardGradC_social" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowC_social" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glowCyanC_social" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .eb-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #5AD2D0; letter-spacing: 2px; text-transform: uppercase; }
      .prod-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 36px; font-weight: 800; fill: #F7F1E7; letter-spacing: -0.5px; }
      .prod-sub-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 36px; font-weight: 800; fill: #5AD2D0; }
      .hl-text-c { font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 700; fill: #F7F1E7; letter-spacing: -0.5px; line-height: 1.15; }
      .sup-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 17.5px; font-weight: 400; fill: #C8E3E1; letter-spacing: 0.2px; }
      .chip-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #FBBF24; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- 1. Dark Architecture Canvas -->
  <rect width="1200" height="630" fill="url(#bgGradC_social)"/>
  
  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#5AD2D0" stroke-width="1"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#5AD2D0"/>

  <!-- 2. Left Column: Text & Brand -->
  <!-- Eyebrow Pill -->
  <g transform="translate(64, 55)">
    <rect x="0" y="0" width="345" height="26" rx="13" fill="#073B49" stroke="#5AD2D0" stroke-width="1.2"/>
    <circle cx="12" cy="13" r="3.5" fill="#5AD2D0"/>
    <text x="24" y="17" class="eb-text-c">LOCAL AUTHORITY · BOUNDED REASONING</text>
  </g>

  <!-- Product Brand Mark & Name -->
  <g transform="translate(64, 135)">
    <g transform="scale(0.7124999999999999)">
      <path d="M0,0 L24,-14 L42,6 L18,20 Z" fill="#FF6B4A"/>
      <path d="M18,20 L42,6 L36,36 L12,48 Z" fill="#5AD2D0"/>
      <path d="M0,0 L18,20 L12,48 L-6,26 Z" fill="#1F9D72"/>
    </g>
    <text x="43" y="24" class="prod-text-c">Nemo<tspan class="prod-sub-c">Fold</tspan></text>
  </g>

  <!-- Headline -->
  <text x="64" y="203" class="hl-text-c">Reasoning may travel.</text>
  <text x="64" y="259" class="hl-text-c">File authority stays local.</text>

  <!-- Supporting Copy -->
  <text x="64" y="317" class="sup-text-c">Explicit scope. Pseudonymized context. Local verification.</text>

  <!-- Status Chip: Cloud proof: pending -->
  <g transform="translate(64, 377)">
    <rect x="0" y="0" width="205" height="36" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8"/>
    <!-- Pending Amber Dot -->
    <circle cx="18" cy="18" r="4.5" fill="#F59E0B"/>
    <text x="31" y="23" class="chip-text-c">Cloud proof: pending</text>
  </g>

  <!-- Key Architecture Invariants -->
  <g transform="translate(64, 429)">
    <g transform="translate(0, 0)">
      <rect width="20" height="20" rx="5" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M6,10 L9,14 L15,7" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#F7F1E7">Approved Folders: originals &amp; paths never leave disk</text>
    </g>
    <g transform="translate(0, 30)">
      <rect width="20" height="20" rx="5" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M6,10 L9,14 L15,7" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#F7F1E7">Policy &amp; Privacy Gate: fail-closed bounded budget</text>
    </g>
    <g transform="translate(0, 60)">
      <rect width="20" height="20" rx="5" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M6,10 L9,14 L15,7" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#F7F1E7">Evidence Verifier: local schema &amp; quote validation</text>
    </g>
  </g>

  <!-- 3. Right Graphic: Trust Split Boundary Diagram -->
  <g transform="translate(660, 70)" filter="url(#shadowC_social)">
    
    <!-- Outer Master Graphic Container -->
    <rect width="480" height="490" rx="13" fill="#031A22" stroke="#073B49" stroke-width="2"/>

    <!-- ZONE A: LOCAL AUTHORITY (Left ~56% of graphic) -->
    <rect x="13" y="13" width="268" height="463" rx="10" fill="url(#localCardGradC_social)" stroke="#1F9D72" stroke-width="1.8"/>
    
    <!-- Zone Header -->
    <g transform="translate(22, 33)">
      <circle cx="6" cy="6" r="4.5" fill="#1F9D72"/>
      <text x="16" y="9" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="800" fill="#F7F1E7" letter-spacing="1.2px">LOCAL AUTHORITY (DOMINANT)</text>
    </g>

    <!-- Node 1: Approved Files & Memory -->
    <g transform="translate(21, 56)">
      <rect width="250" height="75" rx="7" fill="#04232C" stroke="#0E5C6E" stroke-width="1.2"/>
      <text x="10" y="22" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#5AD2D0">Approved Files &amp; Memory</text>
      <text x="10" y="40" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C8E3E1">· Original documents never leave disk</text>
      <text x="10" y="57" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C8E3E1">· Local index, hashes &amp; action ledgers</text>
    </g>

    <!-- Node 2: Policy & Privacy Gate -->
    <g transform="translate(21, 142)">
      <rect width="250" height="75" rx="7" fill="#04232C" stroke="#FF6B4A" stroke-width="1.4"/>
      <text x="10" y="22" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#FF6B4A">Policy + Privacy Gate</text>
      <text x="10" y="40" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C8E3E1">· Explicit scope &amp; pseudonymization</text>
      <text x="10" y="57" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C8E3E1">· Fail closed: unapproved stays local</text>
    </g>

    <!-- Node 3: Local Evidence Verifier -->
    <g transform="translate(21, 227)">
      <rect width="250" height="75" rx="7" fill="#04232C" stroke="#1F9D72" stroke-width="1.4"/>
      <text x="10" y="22" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#1F9D72">Evidence Verifier</text>
      <text x="10" y="40" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C8E3E1">· Checks quotes against local text</text>
      <text x="10" y="57" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C8E3E1">· Verifies source IDs &amp; schema before commit</text>
    </g>

    <!-- Local Summary Guarantee Bar -->
    <g transform="translate(21, 450)">
      <rect width="250" height="28" rx="6" fill="#073B49" stroke="#1F9D72" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="125" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#5AD2D0">NO ORIGINAL FILES OR HOST PATHS</text>
    </g>

    <!-- TRUST BOUNDARY DIVIDER -->
    <g transform="translate(290, 18)">
      <line x1="0" y1="0" x2="0" y2="454" stroke="#5AD2D0" stroke-width="2" stroke-dasharray="6 4" filter="url(#glowCyanC_social)"/>
    </g>

    <!-- ZONE B: BOUNDED REASONING (Right ~34% of graphic) -->
    <g transform="translate(302, 13)">
      <rect width="163" height="463" rx="10" fill="url(#cloudCardGradC_social)" stroke="#818CF8" stroke-width="1.5"/>
      
      <!-- Zone Header -->
      <g transform="translate(10, 33)">
        <circle cx="5" cy="5" r="4.125" fill="#818CF8"/>
        <text x="13" y="8" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="800" fill="#C7D2FE" letter-spacing="0.8px">BOUNDED ZONE</text>
      </g>

      <!-- Cloud Reasoning Box (4 Proven Items) -->
      <g transform="translate(10, 56)">
        <rect width="142" height="196" rx="7" fill="#0A0F1D" stroke="#6366F1" stroke-width="1.4"/>
        <text x="9" y="22" font-family="'Segoe UI', sans-serif" font-size="11.5px" font-weight="700" fill="#A5B4FC">NVIDIA Nemotron</text>
        <text x="9" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5px" font-weight="600" fill="#818CF8">on Nebius</text>
        
        <line x1="9" y1="48" x2="133" y2="48" stroke="#334155" stroke-width="1"/>

        <text x="9" y="71" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#94A3B8">· Optional reasoning</text>
        <text x="9" y="90" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#94A3B8">· Selected context</text>
        <text x="9" y="110" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#94A3B8">· Pseudonymized</text>
        <text x="9" y="129" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#94A3B8">· Bounded budget</text>
      </g>

      <!-- Return Path Box -->
      <g transform="translate(10, 418)">
        <rect width="142" height="48" rx="6" fill="#0A0F1D" stroke="#1F9D72" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="71" y="20" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#1F9D72">RETURN PATH ONLY</text>
        <text x="71" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#5AD2D0">TO LOCAL VERIFIER</text>
      </g>
    </g>

  </g>
</svg>