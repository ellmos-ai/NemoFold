<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="NemoFold - Bounded Reasoning">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradC_thumbnail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021218"/>
      <stop offset="50%" stop-color="#072F3A"/>
      <stop offset="100%" stop-color="#031A22"/>
    </linearGradient>
    <linearGradient id="localCardGradC_thumbnail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4A59" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06323E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cloudCardGradC_thumbnail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowC_thumbnail" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glowCyanC_thumbnail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .eb-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #5AD2D0; letter-spacing: 2px; text-transform: uppercase; }
      .prod-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 38px; font-weight: 800; fill: #F7F1E7; letter-spacing: -0.5px; }
      .prod-sub-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 38px; font-weight: 800; fill: #5AD2D0; }
      .hl-text-c { font-family: Georgia, 'Times New Roman', serif; font-size: 46px; font-weight: 700; fill: #F7F1E7; letter-spacing: -0.5px; line-height: 1.15; }
      .sup-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 18.5px; font-weight: 400; fill: #C8E3E1; letter-spacing: 0.2px; }
      .chip-text-c { font-family: 'Segoe UI', Arial, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #FBBF24; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- 1. Dark Architecture Canvas -->
  <rect width="1280" height="720" fill="url(#bgGradC_thumbnail)"/>
  
  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="180" x2="1280" y2="180" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="0" y1="540" x2="1280" y2="540" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="720" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="720" stroke="#5AD2D0" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="720" stroke="#5AD2D0" stroke-width="1"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1280" height="3" fill="#5AD2D0"/>

  <!-- 2. Left Column: Text & Brand -->
  <!-- Eyebrow Pill -->
  <g transform="translate(72, 65)">
    <rect x="0" y="0" width="360" height="26" rx="13" fill="#073B49" stroke="#5AD2D0" stroke-width="1.2"/>
    <circle cx="12" cy="13" r="3.6" fill="#5AD2D0"/>
    <text x="25" y="17" class="eb-text-c">LOCAL AUTHORITY · BOUNDED REASONING</text>
  </g>

  <!-- Product Brand Mark & Name -->
  <g transform="translate(72, 155)">
    <g transform="scale(0.76)">
      <path d="M0,0 L24,-14 L42,6 L18,20 Z" fill="#FF6B4A"/>
      <path d="M18,20 L42,6 L36,36 L12,48 Z" fill="#5AD2D0"/>
      <path d="M0,0 L18,20 L12,48 L-6,26 Z" fill="#1F9D72"/>
    </g>
    <text x="46" y="25" class="prod-text-c">Nemo<tspan class="prod-sub-c">Fold</tspan></text>
  </g>

  <!-- Headline -->
  <text x="72" y="230" class="hl-text-c">Reasoning may travel.</text>
  <text x="72" y="290" class="hl-text-c">File authority stays local.</text>

  <!-- Supporting Copy -->
  <text x="72" y="355" class="sup-text-c">Explicit scope. Pseudonymized context. Local verification.</text>

  <!-- Status Chip: Cloud proof: pending -->
  <g transform="translate(72, 420)">
    <rect x="0" y="0" width="215" height="36" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8"/>
    <!-- Pending Amber Dot -->
    <circle cx="19" cy="18" r="4.800000000000001" fill="#F59E0B"/>
    <text x="33" y="23" class="chip-text-c">Cloud proof: pending</text>
  </g>

  <!-- Key Architecture Invariants -->
  <g transform="translate(72, 476)">
    <g transform="translate(0, 0)">
      <rect width="20" height="20" rx="5" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M6,10 L9,14 L15,7" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#F7F1E7">Approved Folders: originals &amp; paths never leave disk</text>
    </g>
    <g transform="translate(0, 34)">
      <rect width="20" height="20" rx="5" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M6,10 L9,14 L15,7" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#F7F1E7">Policy &amp; Privacy Gate: fail-closed bounded budget</text>
    </g>
    <g transform="translate(0, 68)">
      <rect width="20" height="20" rx="5" fill="#0B4A59" stroke="#5AD2D0" stroke-width="1"/>
      <path d="M6,10 L9,14 L15,7" fill="none" stroke="#5AD2D0" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="14" font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#F7F1E7">Evidence Verifier: local schema &amp; quote validation</text>
    </g>
  </g>

  <!-- 3. Right Graphic: Trust Split Boundary Diagram -->
  <g transform="translate(705, 85)" filter="url(#shadowC_thumbnail)">
    
    <!-- Outer Master Graphic Container -->
    <rect width="515" height="550" rx="14" fill="#031A22" stroke="#073B49" stroke-width="2"/>

    <!-- ZONE A: LOCAL AUTHORITY (Left ~56% of graphic) -->
    <rect x="14" y="14" width="288" height="522" rx="11" fill="url(#localCardGradC_thumbnail)" stroke="#1F9D72" stroke-width="1.8"/>
    
    <!-- Zone Header -->
    <g transform="translate(24, 35)">
      <circle cx="6" cy="6" r="4.800000000000001" fill="#1F9D72"/>
      <text x="17" y="10" font-family="'Segoe UI', sans-serif" font-size="11.5px" font-weight="800" fill="#F7F1E7" letter-spacing="1.2px">LOCAL AUTHORITY (DOMINANT)</text>
    </g>

    <!-- Node 1: Approved Files & Memory -->
    <g transform="translate(22, 63)">
      <rect width="269" height="85" rx="8" fill="#04232C" stroke="#0E5C6E" stroke-width="1.2"/>
      <text x="11" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5px" font-weight="700" fill="#5AD2D0">Approved Files &amp; Memory</text>
      <text x="11" y="45" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#C8E3E1">· Original documents never leave disk</text>
      <text x="11" y="64" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#C8E3E1">· Local index, hashes &amp; action ledgers</text>
    </g>

    <!-- Node 2: Policy & Privacy Gate -->
    <g transform="translate(22, 159)">
      <rect width="269" height="85" rx="8" fill="#04232C" stroke="#FF6B4A" stroke-width="1.4"/>
      <text x="11" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5px" font-weight="700" fill="#FF6B4A">Policy + Privacy Gate</text>
      <text x="11" y="45" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#C8E3E1">· Explicit scope &amp; pseudonymization</text>
      <text x="11" y="64" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#C8E3E1">· Fail closed: unapproved stays local</text>
    </g>

    <!-- Node 3: Local Evidence Verifier -->
    <g transform="translate(22, 255)">
      <rect width="269" height="85" rx="8" fill="#04232C" stroke="#1F9D72" stroke-width="1.4"/>
      <text x="11" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5px" font-weight="700" fill="#1F9D72">Evidence Verifier</text>
      <text x="11" y="45" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#C8E3E1">· Checks quotes against local text</text>
      <text x="11" y="64" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#C8E3E1">· Verifies source IDs &amp; schema before commit</text>
    </g>

    <!-- Local Summary Guarantee Bar -->
    <g transform="translate(22, 507)">
      <rect width="269" height="30" rx="6" fill="#073B49" stroke="#1F9D72" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="134" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5px" font-weight="700" fill="#5AD2D0">NO ORIGINAL FILES OR HOST PATHS</text>
    </g>

    <!-- TRUST BOUNDARY DIVIDER -->
    <g transform="translate(311, 19)">
      <line x1="0" y1="0" x2="0" y2="512" stroke="#5AD2D0" stroke-width="2" stroke-dasharray="6 4" filter="url(#glowCyanC_thumbnail)"/>
    </g>

    <!-- ZONE B: BOUNDED REASONING (Right ~34% of graphic) -->
    <g transform="translate(324, 14)">
      <rect width="175" height="522" rx="11" fill="url(#cloudCardGradC_thumbnail)" stroke="#818CF8" stroke-width="1.5"/>
      
      <!-- Zone Header -->
      <g transform="translate(11, 35)">
        <circle cx="5" cy="5" r="4.4" fill="#818CF8"/>
        <text x="14" y="9" font-family="'Segoe UI', sans-serif" font-size="10.5px" font-weight="800" fill="#C7D2FE" letter-spacing="0.8px">BOUNDED ZONE</text>
      </g>

      <!-- Cloud Reasoning Box (4 Proven Items) -->
      <g transform="translate(11, 63)">
        <rect width="153" height="220" rx="8" fill="#0A0F1D" stroke="#6366F1" stroke-width="1.4"/>
        <text x="9" y="24" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#A5B4FC">NVIDIA Nemotron</text>
        <text x="9" y="42" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="600" fill="#818CF8">on Nebius</text>
        
        <line x1="9" y1="53" x2="143" y2="53" stroke="#334155" stroke-width="1"/>

        <text x="9" y="79" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#94A3B8">· Optional reasoning</text>
        <text x="9" y="101" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#94A3B8">· Selected context</text>
        <text x="9" y="123" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#94A3B8">· Pseudonymized</text>
        <text x="9" y="145" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#94A3B8">· Bounded budget</text>
      </g>

      <!-- Return Path Box -->
      <g transform="translate(11, 474)">
        <rect width="153" height="51" rx="6" fill="#0A0F1D" stroke="#1F9D72" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="76" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#1F9D72">RETURN PATH ONLY</text>
        <text x="76" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5px" font-weight="700" fill="#5AD2D0">TO LOCAL VERIFIER</text>
      </g>
    </g>

  </g>
</svg>